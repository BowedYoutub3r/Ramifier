name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish self-contained exe
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          dotnet publish src/Ramifier/Ramifier.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=$version -o publish

      - name: Create release zip
        run: |
          Copy-Item src/local/imdiskinst.exe publish/imdiskinst.exe
          Compress-Archive -Path publish/Ramifier.exe, publish/imdiskinst.exe -DestinationPath Ramifier-${{ github.ref_name }}-win-x64.zip

      - name: Generate checksums
        run: |
          Get-FileHash Ramifier-${{ github.ref_name }}-win-x64.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash > checksums.txt
          Get-FileHash publish/Ramifier.exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash >> checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Ramifier-${{ github.ref_name }}-win-x64.zip
            publish/Ramifier.exe
            publish/imdiskinst.exe
            checksums.txt
